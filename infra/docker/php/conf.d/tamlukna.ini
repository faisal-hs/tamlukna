; Tamlukna PHP settings (development)
date.timezone = UTC
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
